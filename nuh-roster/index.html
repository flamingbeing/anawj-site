<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NUH Roster</title>
<meta name="description" content="Draft the daily anaesthesia OT roster and export it as an Excel file. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>NUH Roster</h1>
    <p class="privacy" id="privacy">Runs in this browser only. Nothing you enter or load is uploaded.</p>
  </div>
  <div id="date" class="datebar"></div>
  <div class="team">
    <div id="cloud" class="cloud"></div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="monthly">Monthly</button>
  <button role="tab" data-tab="cases">Cases</button>
  <button role="tab" data-tab="roster">Roster</button>
  <button role="tab" data-tab="premed">Premeds</button>
  <button role="tab" data-tab="staff" class="setup">Staff</button>
  <button role="tab" data-tab="settings" class="setup" aria-label="Settings" title="Settings"><svg class="gear" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg><span class="tab-text">Settings</span></button>
</nav>

<main id="app"></main>
<footer class="foot">
  <span>Staff list, rooms and settings as a file:</span>
  <button id="saveTeam" class="small" title="Download the staff list, rooms and settings as a JSON file">Export JSON</button>
  <label class="btn small" title="Replace the staff list, rooms and settings from a JSON file">Import JSON<input id="loadTeam" type="file" accept=".json,application/json" hidden></label>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/exceljs.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
