<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUH Roster</title>
<meta name="description" content="Draft the daily anaesthesia OT roster and export it as an Excel file. Runs entirely in your browser.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>NUH Roster</h1>
    <p class="privacy" id="privacy">Runs in this browser only. Nothing you enter or load is uploaded.</p>
  </div>
  <div class="team">
    <div id="cloud" class="cloud"></div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="roster">Roster</button>
  <button role="tab" data-tab="premed">Premed</button>
  <button role="tab" data-tab="cases">Cases</button>
  <button role="tab" data-tab="manpower">Manpower</button>
  <button role="tab" data-tab="seniors">Seniors</button>
  <button role="tab" data-tab="juniors">Juniors</button>
  <button role="tab" data-tab="settings">Settings</button>
</nav>

<main id="app"></main>
<footer class="foot">
  <span>Staff list, rooms and settings as a file:</span>
  <button id="saveTeam" class="small" title="Download the staff list, rooms and settings as a JSON file">Export JSON</button>
  <label class="btn small" title="Replace the staff list, rooms and settings from a JSON file">Import JSON<input id="loadTeam" type="file" accept=".json,application/json" hidden></label>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/exceljs.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
