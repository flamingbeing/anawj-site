<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Open in Obsidian</title>
<style>
/* Forwards anawj.com/o/#vault=NAME&file=PATH to the Obsidian app (chat apps open only https links). Holds no data;
   the vault and file sit after the # so they are never sent to the server. */
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;color:#ececef;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:16px}
a{display:inline-block;min-height:48px;padding:12px 28px;border-radius:24px;background:#6ea3ff;color:#08111f;font-weight:600;font-size:20px;text-decoration:none}
a#plain{background:transparent;border:1px solid #3a3a42;color:#ececef;font-size:16px;min-height:44px;padding:10px 24px}
a[hidden]{display:none}
button{min-height:44px;padding:10px 24px;border:1px solid #3a3a42;border-radius:22px;background:transparent;color:#ececef;font:inherit;font-size:16px}
p{margin:0;color:#9a9aa2;font-size:14px;word-break:break-all}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<p id="msg">Opening Obsidian…</p>
<a id="go" href="#" hidden>Open in Obsidian</a>
<a id="plain" href="#" hidden>Pull only (new note)</a>
<p id="what"></p>
<button id="close" type="button">Close</button>
<script>
// Only vault and file are forwarded, re-encoded, so this page can only ever build an obsidian:// link: by default an
// Advanced URI one that opens the note and runs Git: Pull (needs the Advanced URI plugin). A note not yet on the
// phone fails with "file not found" before the pull runs, so the second button runs the pull alone; #pull=0 gives the
// plain open link.
const q = new URLSearchParams(location.hash.slice(1)), vault = q.get('vault'), file = q.get('file');
const msg = document.getElementById('msg'), go = document.getElementById('go');
if (!vault) {
  msg.textContent = 'Use /o/#vault=NAME&file=PATH';
} else {
  const p = new URLSearchParams({ vault });
  if (file) p.set('file', file);
  const enc = x => x.toString().replace(/\+/g, '%20');   // Obsidian wants %20, not +
  const plain = 'obsidian://open?' + enc(p);
  const pull = q.get('pull') !== '0';
  let uri = plain;
  if (pull) {
    const a = new URLSearchParams({ vault });
    if (file) a.set('filepath', file);
    a.set('commandid', 'obsidian-git:pull');
    uri = 'obsidian://adv-uri?' + enc(a);
    const pl = document.getElementById('plain');
    pl.href = 'obsidian://adv-uri?vault=' + encodeURIComponent(vault) + '&commandid=obsidian-git%3Apull';
    pl.hidden = false;
  }
  go.href = uri;
  go.hidden = false;
  document.getElementById('what').textContent = vault + (file ? ' / ' + file : '');
  msg.textContent = 'Opening Obsidian… if nothing happens, tap the button.';
  location.replace(uri);
  // Once Obsidian has taken over, try to close this tab (browsers allow it only for tabs a script opened, so it may stay).
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { msg.textContent = 'Opened. You can close this tab.'; setTimeout(() => window.close(), 300); }
  });
}
// Close button: window.close() works only for tabs a script opened, so fall back to going back, then to a hint.
document.getElementById('close').addEventListener('click', () => {
  window.close();
  setTimeout(() => {
    if (history.length > 1) history.back();
    else msg.textContent = 'Your browser blocks closing this tab; close it yourself.';
  }, 200);
});
</script>
</body>
</html>
