<script>
  // The logbook now lives at apmes.anawj.com (SUBDOMAINS.md). The same folder is still served at anawj.com/logbook/, so send
  // visitors on from there (path, query and # kept). Only for the top page, and a no-op on apmes.anawj.com, the PR previews,
  // localhost and the /edit/ iframe (no loop). A browser with logbook settings saved at the old address stays for a moment,
  // because what a browser saves belongs to its address: the page offers to download it first (window.LOGBOOK_MOVED_TO, js/moved.js).
  if (top === self && /^(www\.)?anawj\.com$/.test(location.hostname)) (function () {
    var to = 'https://apmes.anawj.com' + location.pathname + location.search + location.hash, saved = false;
    try {
      for (var i = 0; i < localStorage.length && !saved; i++) { var k = localStorage.key(i); saved = /^(apmes-)?logbook-/.test(k) && !/^apmes-logbook-(demo|moved|install|cloud)/.test(k); }
      if (localStorage.getItem('apmes-logbook-moved')) saved = false;
    } catch (e) { /* no storage */ }
    if (saved && !/[?&]demo\b/.test(location.search)) window.LOGBOOK_MOVED_TO = to; else location.replace(to);
  })();
</script>
<script>
  // back from Google or Dropbox after a Save to Drive / Dropbox sign-in (cloud-save.js): keep the answer for the
  // app (it finishes the save after sign-in) and tidy the address back to the Backup page
  try { var cq = new URLSearchParams(location.search), cf = new URLSearchParams(location.hash.slice(1)); if (/^dbx-/.test(cq.get('state') || '') || /^gdr-/.test(cf.get('state') || '')) { sessionStorage.setItem('apmes-logbook-cloud-return', JSON.stringify({ search: location.search, hash: location.hash })); var cp = JSON.parse(localStorage.getItem('apmes-logbook-cloud-pending') || '{}') || {}; history.replaceState(null, '', location.pathname + (cp.demo ? '?demo' : '') + '#data'); } } catch (e) {}
  // this device's display choices that change the layout, before the first paint (ui-settings.js applyLook)
  try { var dd = JSON.parse(localStorage.getItem('apmes-logbook-display') || '{}') || {}, dc = document.documentElement.classList; if (dd.lineWidth === 'narrow' || dd.lineWidth === 'wide' || dd.lineWidth === 'full') dc.add('lw-' + dd.lineWidth); dc.add(dd.contrast === 'high' ? 'hc' : dd.contrast === 'normal' ? 'hc-off' : 'hc-auto'); dc.add(dd.motion === 'reduce' ? 'rm' : dd.motion === 'full' ? 'rm-off' : 'rm-auto'); if (dd.tabIcons) dc.add('tab-icons'); if (dd.tabBar === 'top' || dd.tabBar === 'bottom') dc.add('tabs-' + dd.tabBar); if (dd.hideHeader) dc.add('no-header', 'who-alert'); if (dd.caseInverted) dc.add('case-inverted'); if (dd.autoFocus === false) dc.add('no-autofocus'); if (dd.lineHeight) document.documentElement.style.setProperty('--lh', dd.lineHeight); if ([0, 1, 2, 3].indexOf(dd.borders) >= 0) { dc.add('edges'); if (dd.borders <= 1) dc.add('edges-fill'); document.documentElement.style.setProperty('--edge-mix', [0, 25, 50, 75][dd.borders] + '%'); } if ([0, 1, 3].indexOf(dd.round) >= 0) document.documentElement.style.setProperty('--round', String([0, 0.5, 1, 1.7][dd.round])); if (dd.shadows !== false) dc.add('shadows'); if (dd.bigTaps) dc.add('big-taps'); } catch (e) {}
  // this device's theme before the first paint (Settings → Display → Theme; light unless chosen)
  try { var t = localStorage.getItem('apmes-logbook-theme'); document.documentElement.dataset.theme = t === 'dark' || t === 'oled' ? 'dark' : t === 'auto' ? 'auto' : 'light'; if (t === 'oled') document.documentElement.dataset.oled = ''; } catch (e) {}
  // and its colour (Settings → Display → Colour; navy unless chosen): the palettes colors.js worked out last time
  try { var css = localStorage.getItem('apmes-logbook-accent-css'); if (css && css.length < 8000) { var st = document.createElement('style'); st.id = 'accent-css'; st.textContent = css; document.head.appendChild(st); } } catch (e) {}
</script>
