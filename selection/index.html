<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>APMES Selection</title>
<meta name="description" content="Confidential 360 feedback on residency applicants, for APMES residents and faculty.">
<meta name="theme-color" content="#f9f9fb">
<link rel="icon" type="image/png" sizes="32x32" href="../evals/icons/favicon-32.png">
<link rel="apple-touch-icon" href="../evals/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" media="print" onload="this.media='all'">
<script>
  // Selection lives at apmes.anawj.com/selection/ (one sign-in with the logbook, evals and People). Send visitors on from
  // anawj.com, keeping the part after # (a round link). A no-op on apmes.anawj.com, previews and localhost.
  if (top === self && /^(www\.)?anawj\.com$/.test(location.hostname)) location.replace('https://apmes.anawj.com' + location.pathname + location.search + location.hash);
  // evals' theme choice applies here too
  try { var t = localStorage.getItem('evals-theme'); if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; } catch (e) {}
</script>
<link rel="stylesheet" href="../nuhsdesign/tokens.css">
<link rel="stylesheet" href="../nuhsdesign/app.css">
<link rel="stylesheet" href="../evals/style.css">
<script src="../nuhsdesign/app.js" defer></script>
<style>
  .sl-col { max-width: 720px; margin: 0 auto; }
  .sl-intro p { margin: 0 0 8px; }
  .sl-conf { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--a-surface-2); font-size: var(--a-text-sm); color: var(--a-ink-2); }
  .sl-bar { height: 6px; border-radius: 3px; background: var(--a-surface-2); overflow: hidden; margin: 10px 0 4px; }
  .sl-bar > i { display: block; height: 100%; background: var(--a-tint); }
  .sl-scores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0 0; padding: 0; border: 0; }
  .sl-scores label { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; border-radius: 12px; background: var(--a-surface-2); cursor: pointer; text-align: center; padding: 6px 2px; }
  .sl-scores input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .sl-scores b { font-size: 22px; line-height: 1; }
  .sl-scores span { font-size: 11px; line-height: 1.15; color: var(--a-ink-2); }
  .sl-scores label:has(input:checked) { background: var(--a-tint); color: #fff; }
  .sl-scores label:has(input:checked) span { color: #fff; }
  .sl-scores label:has(input:focus-visible) { outline: 3px solid var(--a-focus); outline-offset: 2px; }
  .sl-scores:disabled { opacity: .45; }
  .sl-nav { display: flex; gap: 8px; margin-top: 16px; }
  .sl-nav > * { flex: 1; }
  .sl-pos { margin: 0 0 6px; font-size: var(--a-text-xs); color: var(--a-ink-2); }
  .sl-saved { margin: 6px 0 0; font-size: var(--a-text-xs); color: var(--a-ink-2); min-height: 1.2em; }
  .sl-mean { font-variant-numeric: tabular-nums; font-weight: 700; }
  .sl-comments { margin: 8px 0 0; padding-left: 18px; font-size: var(--a-text-sm); }
  .sl-comments li { margin: 0 0 6px; white-space: pre-wrap; }
  .sl-who { color: var(--a-ink-2); }
  .sl-comments a { text-decoration: underline; }
  .sl-code { width: 100%; min-height: 6.5em; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body class="a-app e-nonav">
<header class="a-bar e-appbar">
  <div class="a-band"><i></i><i></i><i></i><i></i></div>
  <div class="a-bar-row">
    <button type="button" id="back" class="a-bar-btn e-appbar__back" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span aria-hidden="true">Back</span></button>
    <div class="e-appbar__titles">
      <h1 id="title" class="a-bar-title e-appbar__title">APMES Selection</h1>
      <p id="sub" class="e-appbar__sub" hidden></p>
    </div>
    <div id="me" class="e-appbar__right"></div>
  </div>
</header>
<main id="app" class="a-main"><p class="e-loading">Loading…</p></main>
<div id="toast" class="a-toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
