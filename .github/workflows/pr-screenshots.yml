# Before-and-after phone screenshots on every PR: the first screen (390 px) of each app the PR changes, on main and on
# the PR, both served from checkouts in demo mode (fake data). One comment per PR, updated on each push. The pictures
# live on the branch "pr-screenshots": one commit with no history, holding only open PRs' latest pictures, so the repo
# doesn't grow. Pages: tools/shots.mjs (PAGES), plus "Screens: /logbook/?demo#notes" lines in the PR description.
name: PR screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shots:
    # same-repo PRs only (a fork's PR gets a read-only token), and never for the pictures' own branch
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'pr-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: head
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Which pages
        id: pages
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          cd head
          printf '%s' "$BODY" > ../body.txt
          pages=$(node tools/shots.mjs pages "origin/$BASE" ../body.txt)
          echo "$pages"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
      - name: Install a browser
        if: steps.pages.outputs.pages != '[]'
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Screenshots of main and of this PR
        if: steps.pages.outputs.pages != '[]'
        env:
          PAGES: ${{ steps.pages.outputs.pages }}
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs"
          git -C head worktree add ../base "origin/$BASE"
          (cd base && python3 -m http.server 8001 >/dev/null 2>&1 &)
          (cd head && python3 -m http.server 8002 >/dev/null 2>&1 &)
          sleep 1
          mapfile -t list < <(node -e 'for (const p of JSON.parse(process.env.PAGES)) console.log(p)')
          node head/tools/shots.mjs shoot http://localhost:8001 out before "${list[@]}"
          node head/tools/shots.mjs shoot http://localhost:8002 out after "${list[@]}"
      - name: Keep the pictures on the pr-screenshots branch (open PRs only, no history)
        if: steps.pages.outputs.pages != '[]'
        run: |
          cd head
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number -q '.[].number')
          for attempt in 1 2 3 4 5; do
            rm -rf ../tree && mkdir ../tree
            lease=""
            if git fetch -q origin pr-screenshots 2>/dev/null; then
              lease=$(git rev-parse FETCH_HEAD)
              git archive FETCH_HEAD | tar -x -C ../tree
            fi
            # keep other open PRs' pictures; this PR's are replaced
            for d in ../tree/*/; do n=$(basename "$d"); if [ "$n" = "$PR" ] || ! grep -qx "$n" <<< "$open"; then rm -rf "$d"; fi; done
            mkdir -p "../tree/$PR/${SHA:0:7}" && cp ../out/*.jpg "../tree/$PR/${SHA:0:7}/" 2>/dev/null || true
            printf 'Screenshots for open PRs (.github/workflows/pr-screenshots.yml). Rewritten on every run; no history.\n' > ../tree/README.md
            gitdir=$(git rev-parse --absolute-git-dir)
            tree=$(cd ../tree && GIT_DIR="$gitdir" GIT_WORK_TREE=. GIT_INDEX_FILE="$PWD/../idx" sh -c 'git add -A . && git write-tree')
            commit=$(git commit-tree "$tree" -m "Screenshots for open PRs (latest: #$PR ${SHA:0:7})")
            rm -f ../idx
            if [ -n "$lease" ]; then
              git push -q --force-with-lease="pr-screenshots:$lease" origin "$commit:refs/heads/pr-screenshots" && break
            else
              git push -q origin "$commit:refs/heads/pr-screenshots" && break
            fi
            sleep $((attempt * 3))
          done
      - name: Post or update the comment
        if: steps.pages.outputs.pages != '[]'
        run: |
          node head/tools/shots.mjs comment out "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pr-screenshots/$PR/${SHA:0:7}" "$SHA" > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- pr-screenshots -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md; fi
