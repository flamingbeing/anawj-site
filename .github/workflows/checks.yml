# The merge checklist from AGENTS.md, run on every PR (and on main): the repo check, every unit test, the proof-read,
# and the quick browser tests of the page editor, the feedback button, the hand pages and the NUH roster (Practice). The long browser suites
# (logbook, prewarm, evals) stay with the session that changes those apps (AGENTS.md lists them).
# On a PR, four browser suites run only when the PR changes their app (owner, 15 Oct 2026): BIS to DSA (bis-dsa/), OT simulator (ot-sim/),
# feedback button (feedback/ or worker/) and hand pages (hand-babies/ or edit/, since the hand test opens the editor). A PR that changes
# this workflow, and every push to main, runs them all.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo check
        run: node tools/check.mjs
      - name: Unit tests
        run: for f in evals/test/*.test.mjs logbook/test/*.test.mjs nuh-roster/test/*.test.mjs ntf-roster/test/*.test.mjs prewarm/test/*.test.mjs people/test/*.test.mjs worker/test/*.test.mjs feedback/test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: BIS to DSA engine tuning
        run: node bis-dsa/test/engine.check.mjs
      - name: OT simulator model tests
        run: for f in ot-sim/test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Which apps this PR changes
        id: ch
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # not a PR, or the file list can't be read: run everything
          if [ "$EVENT" != "pull_request" ] || ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename'); then
            for k in bis ot feedback hand; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0
          fi
          all=false; echo "$files" | grep -qE '^\.github/workflows/checks\.yml$' && all=true
          has() { if [ "$all" = true ] || echo "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "bis=$(has '^bis-dsa/')" >> "$GITHUB_OUTPUT"
          echo "ot=$(has '^ot-sim/')" >> "$GITHUB_OUTPUT"
          echo "feedback=$(has '^(feedback|worker)/')" >> "$GITHUB_OUTPUT"
          echo "hand=$(has '^(hand-babies|edit)/')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Page editor, feedback button, Ask Claude, hand pages, NUH roster, NTF roster, People
        env:
          RUN_BIS: ${{ steps.ch.outputs.bis }}
          RUN_OT: ${{ steps.ch.outputs.ot }}
          RUN_FEEDBACK: ${{ steps.ch.outputs.feedback }}
          RUN_HAND: ${{ steps.ch.outputs.hand }}
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs"
          (python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 1
          node edit/test/e2e.mjs
          if [ "$RUN_FEEDBACK" = true ]; then node feedback/test/e2e.mjs; else echo "feedback e2e: skipped (this PR does not change feedback/ or worker/)"; fi
          node ask/test/e2e.mjs
          if [ "$RUN_HAND" = true ]; then node hand-babies/test/e2e.mjs; else echo "hand e2e: skipped (this PR does not change hand-babies/ or edit/)"; fi
          if [ "$RUN_BIS" = true ]; then node bis-dsa/test/e2e.mjs; else echo "bis-dsa e2e: skipped (this PR does not change bis-dsa/)"; fi
          if [ "$RUN_OT" = true ]; then node ot-sim/test/e2e.mjs; else echo "ot-sim e2e: skipped (this PR does not change ot-sim/)"; fi
          node nuh-roster/test/e2e.mjs
          node ntf-roster/test/e2e.mjs
          node ntf-roster/test/tour.e2e.mjs
          node ntf-roster/test/perf.e2e.mjs || node ntf-roster/test/perf.e2e.mjs   # speed budgets: timings vary, so it fails only if a second run is over too
          node people/test/e2e.mjs
