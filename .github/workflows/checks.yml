# The merge checklist from AGENTS.md, run on every PR (and on main): the repo check, every unit test, the proof-read,
# and the feedback button's browser test. Since the repo split (21 Oct 2026) the apps live in their own repos; the
# feedback test tries pages from hand, rosters and prewarm, so it checks those out beside this one (all public).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo check
        run: node tools/check.mjs
      - name: Unit tests
        run: for f in worker/test/*.test.mjs feedback/test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  # kept under the old name, so anything that waits on "browser" still works
  browser:
    # pinned: Playwright 1.56.1 can't install Chromium on Ubuntu 26.04 (what ubuntu-latest became on 22 Oct 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: flamingbeing/hand, path: .sib/hand }
      - uses: actions/checkout@v4
        with: { repository: flamingbeing/rosters, path: .sib/rosters }
      - uses: actions/checkout@v4
        with: { repository: flamingbeing/prewarm, path: .sib/prewarm }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Feedback button
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs" SIBLINGS="$PWD/.sib"
          node feedback/test/e2e.mjs
